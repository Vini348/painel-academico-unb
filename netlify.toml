[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Mantém o pacote completo do PDF.js disponível em node_modules no ambiente
  # serverless, incluindo pdf.worker.mjs usado pelo fake worker do Node.js.
  external_node_modules = ["pdfjs-dist"]
  # Inclui explicitamente o worker: o import dinâmico interno do PDF.js não é
  # detectado automaticamente pelo empacotador de funções do Netlify.
  included_files = ["node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
