name: Despertador do Supabase

# Faz uma leitura no banco a cada 3 dias para o plano gratuito não pausar (ele pausa após 7 dias sem uso).
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          code=$(curl -s -o resp.json -w "%{http_code}" "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat resp.json
          test "$code" = "200"
